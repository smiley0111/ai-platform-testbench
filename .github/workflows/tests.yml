name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: API / AI 生成用例 / Notebook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,notebook]"
      - run: pytest -n 4 tests/api tests/aitest tests/notebook

  training:
    name: 训练（CPU PyTorch）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -n 4 tests/training
