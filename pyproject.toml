[project]
name = "ai-platform-testbench"
version = "0.1.0"
description = "AI 平台测试工作台：OpenAI 兼容推理网关 + 模型 API / 性能 / 训练 / Notebook 测试"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dodu" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
perf = ["locust>=2.30"]
dev = [
    "pytest>=8.0",
    "openai>=1.40",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ollama: 需要本地 Ollama 服务（http://localhost:11434），不可用时自动跳过",
]
