# 稳定版网关。Service 只按 app=gateway 选择 Pod，灰度版（track=canary）也会被选中，
# 流量按两边就绪 Pod 的数量分配。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway, track: stable}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway, track: stable}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # 新 Pod 就绪之前不删旧 Pod；新版本起不来时线上容量不受影响
      maxSurge: 1
  template:
    metadata:
      labels: {app: gateway, track: stable}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: testbench-gateway:ci
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: TESTBENCH_VERSION, value: v1}
            - {name: TESTBENCH_RPM, value: "1000000"}
            - {name: TESTBENCH_EXTRA_KEYS, value: "sk-limited:6"}
            - {name: TESTBENCH_MOCK_LATENCY, value: "0.2"}
            - {name: TESTBENCH_LOG_LEVEL, value: warning}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Pod 被删除时，摘除 Endpoint 和发送 SIGTERM 是并行的。先等几秒，
            # 让各节点的 kube-proxy 把它从转发规则里删掉，再让进程停止接新连接。
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
